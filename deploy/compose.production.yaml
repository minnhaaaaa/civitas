# Production-oriented overlay.  Supply secrets through the platform secret
# manager; this file deliberately contains no credentials or published database
# port.  TLS terminates at an authenticated reverse proxy/load balancer.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?inject at runtime}

  api:
    environment:
      CIVITAS_ENV: production
      CIVITAS_LOG_FORMAT: json
      CIVITAS_LIVE_PROVIDER_REQUIRED: ${CIVITAS_LIVE_PROVIDER_REQUIRED:-true}
      CIVITAS_PROVIDER_FACTORY: ${CIVITAS_PROVIDER_FACTORY:?configure module:callable}
      CIVITAS_REQUIRE_WORKER_READY: "true"
      CIVITAS_AUDIT_VIEWER_ENABLED: ${CIVITAS_AUDIT_VIEWER_ENABLED:-false}
      CIVITAS_AUDIT_VIEWER_BASE_URL: ${CIVITAS_AUDIT_VIEWER_BASE_URL:-}
      CIVITAS_AUDIT_LINK_SECRET: ${CIVITAS_AUDIT_LINK_SECRET:-}
      CIVITAS_BEARER_TOKEN: ${CIVITAS_BEARER_TOKEN:?inject at runtime}
      CIVITAS_APPROVAL_SECRET_PEPPER: ${CIVITAS_APPROVAL_SECRET_PEPPER:?inject at runtime}
      CIVITAS_ORGANIZATION_ID: ${CIVITAS_ORGANIZATION_ID:?bind at runtime}
      CIVITAS_OPERATOR_ID: ${CIVITAS_OPERATOR_ID:?bind at runtime}
      CIVITAS_OAUTH_ISSUER: ${CIVITAS_OAUTH_ISSUER:-}
      CIVITAS_OAUTH_AUDIENCE: ${CIVITAS_OAUTH_AUDIENCE:-}
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  worker:
    environment:
      CIVITAS_ENV: production
      CIVITAS_LOG_FORMAT: json
      CIVITAS_LIVE_PROVIDER_REQUIRED: ${CIVITAS_LIVE_PROVIDER_REQUIRED:-true}
      CIVITAS_PROVIDER_FACTORY: ${CIVITAS_PROVIDER_FACTORY:?configure module:callable}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  mcp-server:
    environment:
      CIVITAS_ENV: production
      CIVITAS_LOG_FORMAT: json
      CIVITAS_LIVE_PROVIDER_REQUIRED: ${CIVITAS_LIVE_PROVIDER_REQUIRED:-true}
      CIVITAS_PROVIDER_FACTORY: ${CIVITAS_PROVIDER_FACTORY:?configure module:callable}
      CIVITAS_REQUIRE_WORKER_READY: "true"
      CIVITAS_BEARER_TOKEN: ${CIVITAS_BEARER_TOKEN:?inject at runtime}
      CIVITAS_OAUTH_ISSUER: ${CIVITAS_OAUTH_ISSUER:-}
      CIVITAS_OAUTH_AUDIENCE: ${CIVITAS_OAUTH_AUDIENCE:-}
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  audit-viewer:
    ports: !reset []
