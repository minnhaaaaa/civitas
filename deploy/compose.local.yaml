name: civitas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civitas}
      POSTGRES_USER: ${POSTGRES_USER:-civitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${CIVITAS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - civitas-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrations:
    build:
      context: ..
    image: civitas:local
    environment: &civitas-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-civitas}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-civitas}
      CIVITAS_APPROVAL_SECRET_PEPPER: ${CIVITAS_APPROVAL_SECRET_PEPPER:?set a 32-byte approval pepper}
      CIVITAS_BEARER_TOKEN: ${CIVITAS_BEARER_TOKEN:?set a 32-character bearer token}
      CIVITAS_ORGANIZATION_ID: ${CIVITAS_ORGANIZATION_ID:?bind an organization}
      CIVITAS_OPERATOR_ID: ${CIVITAS_OPERATOR_ID:?bind an operator}
      CIVITAS_LOG_FORMAT: json
      CIVITAS_ENV: ${CIVITAS_ENV:-development}
      CIVITAS_SERVICE_NAME: ${CIVITAS_SERVICE_NAME:-civitas-mcp}
      CIVITAS_LIVE_PROVIDER_REQUIRED: ${CIVITAS_LIVE_PROVIDER_REQUIRED:-true}
      CIVITAS_PROVIDER_FACTORY: ${CIVITAS_PROVIDER_FACTORY:-civitas.runtime.simulated_provider:create_dependencies}
      CIVITAS_SIMULATOR_SKU_ID: ${CIVITAS_SIMULATOR_SKU_ID:-sku-local}
      CIVITAS_SIMULATOR_WAREHOUSE_ID: ${CIVITAS_SIMULATOR_WAREHOUSE_ID:-warehouse-local}
      CIVITAS_SIMULATOR_SUPPLIER_ID: ${CIVITAS_SIMULATOR_SUPPLIER_ID:-supplier-local}
      CIVITAS_REQUIRE_WORKER_READY: ${CIVITAS_REQUIRE_WORKER_READY:-false}
      CIVITAS_AUDIT_VIEWER_ENABLED: ${CIVITAS_AUDIT_VIEWER_ENABLED:-false}
      CIVITAS_AUDIT_VIEWER_BASE_URL: ${CIVITAS_AUDIT_VIEWER_BASE_URL:-}
      CIVITAS_AUDIT_LINK_SECRET: ${CIVITAS_AUDIT_LINK_SECRET:-}
      CIVITAS_AUDIT_LINK_TTL_SECONDS: ${CIVITAS_AUDIT_LINK_TTL_SECONDS:-900}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["demo"]
    image: civitas:local
    environment: *civitas-environment
    command: ["uvicorn", "civitas.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "${CIVITAS_API_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "scripts/http_healthcheck.py", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=1777

  demo-provision:
    profiles: ["mcp"]
    image: civitas:local
    environment: *civitas-environment
    command: ["civitas-demo-seed"]
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  # Durable workflow worker; execution side effects remain in the guarded execution service.
  worker:
    profiles: ["mcp"]
    image: civitas:local
    command: ["civitas-worker"]
    environment:
      <<: *civitas-environment
      CIVITAS_WORKER_FACTORY: civitas.runtime:create_worker
      CIVITAS_SERVICE_NAME: civitas-worker
      CIVITAS_WORKER_ID: ${CIVITAS_WORKER_ID:-worker-local-1}
      CIVITAS_WORKER_LEASE_SECONDS: ${CIVITAS_WORKER_LEASE_SECONDS:-60}
      CIVITAS_WORKER_MAX_ATTEMPTS: ${CIVITAS_WORKER_MAX_ATTEMPTS:-5}
    depends_on:
      demo-provision:
        condition: service_completed_successfully
    init: true
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 45s
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=1777

  # The authenticated Streamable HTTP MCP server supplied by Agent 1. Its
  # runtime command is explicit so deployment never invents an alternate path.
  mcp-server:
    profiles: ["mcp"]
    image: civitas:local
    environment:
      <<: *civitas-environment
      CIVITAS_MCP_HOST: 0.0.0.0
    command: ["civitas-mcp"]
    ports:
      - "${CIVITAS_MCP_PORT:-8001}:8001"
    depends_on:
      migrations:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "scripts/http_healthcheck.py", "http://127.0.0.1:8001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=1777

  audit-viewer:
    profiles: ["audit-viewer"]
    build:
      context: ..
      dockerfile: deploy/audit-viewer.Dockerfile
    image: civitas-audit-viewer:local
    ports:
      - "${CIVITAS_AUDIT_VIEWER_PORT:-8080}:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    restart: unless-stopped

volumes:
  civitas-postgres-data:
