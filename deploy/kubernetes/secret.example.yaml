apiVersion: v1
kind: Secret
metadata:
  name: civitas-runtime-secrets
  namespace: civitas
type: Opaque
stringData:
  DATABASE_URL: replace-via-external-secret-manager
  CIVITAS_APPROVAL_SECRET_PEPPER: replace-via-external-secret-manager
  CIVITAS_BEARER_TOKEN: replace-via-external-secret-manager
  CIVITAS_ORGANIZATION_ID: replace-via-external-secret-manager
  CIVITAS_OPERATOR_ID: replace-via-external-secret-manager
  # Required only when CIVITAS_AUDIT_VIEWER_ENABLED=true; keep independent.
  CIVITAS_AUDIT_LINK_SECRET: replace-with-at-least-32-random-bytes
  # Provider bootstrap reads secret references or mounted secret files; never log values.
  PROVIDER_PLANNING_CREDENTIAL_REF: replace-via-external-secret-manager
  PROVIDER_DISSENT_CREDENTIAL_REF: replace-via-external-secret-manager
  PROVIDER_EXECUTION_CREDENTIAL_REF: replace-via-external-secret-manager
