apiVersion: batch/v1
kind: Job
metadata:
  name: civitas-migrations
  labels:
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civitas-migrations
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: civitas
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: civitas:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: civitas-runtime
            - secretRef:
                name: civitas-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
