apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civitas-mcp
  namespace: civitas
spec:
  tls:
    - hosts: [civitas.example.com]
      secretName: civitas-mcp-tls
  rules:
    - host: civitas.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: civitas-mcp
                port:
                  name: http
