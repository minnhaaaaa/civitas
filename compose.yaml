name: civitas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: civitas
      POSTGRES_USER: civitas
      POSTGRES_PASSWORD: civitas_dev
    ports:
      - "${CIVITAS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civitas -d civitas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - civitas-postgres-data:/var/lib/postgresql/data

volumes:
  civitas-postgres-data:
